<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeFound | Digital Experiences</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f2eb;
      color: #242820;
    }

    header {
      padding: 28px 8%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #dedbd2;
    }

    .logo {
      font-size: 25px;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .hero {
      min-height: 75vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 80px 10%;
    }

    .label {
      color: #64765b;
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 12px;
    }

    h1 {
      max-width: 850px;
      font-size: clamp(48px, 9vw, 100px);
      line-height: 0.98;
      letter-spacing: -5px;
      margin: 25px 0;
    }

    .description {
      max-width: 480px;
      line-height: 1.8;
      color: #66665e;
      font-size: 17px;
    }

    .button {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 25px;
      background: #29352a;
      color: white;
      text-decoration: none;
      border-radius: 4px;
      width: fit-content;
    }

    footer {
      padding: 25px 8%;
      border-top: 1px solid #dedbd2;
      color: #77776e;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">BeFound.</div>
    <span>Digital Studio</span>
  </header>

  <main class="hero">
    <div class="label">Independent Digital Studio</div>
    <h1>Your business.<br>Better online.</h1>
    <p class="description">
      We design modern websites that help businesses build their
      brand, connect with customers, and grow.
    </p>
    <a class="button" href="mailto:hello@befound.com">
      Start a project ↗
    </a>
  </main>

  <footer>© 2026 BeFound Studio. All rights reserved.</footer>
</body>
</html>
